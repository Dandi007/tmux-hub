name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      # Per-run tmux socket: keeps CI's tmux server isolated from the
      # production hub and any other tmux servers on the runner host.
      TMUX_HUB_SOCKET: ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # CLI/registry tests probe tmux liveness (listSessions → exit 1 when no
      # server is reachable). The runner service is headless with no tmux
      # server of its own, so start a dedicated one for this run.
      - name: Start tmux server for tests
        run: tmux -L "$TMUX_HUB_SOCKET" new-session -d -s ci-keeper 'sleep 3600'

      - name: Lint tests
        run: bun run lint:tests

      # hub-tui / viewport-ownership are pre-existing broken (they fail in any
      # environment, tracked since 2026-07-05) — excluded until fixed so CI
      # guards everything else. Do NOT add new files to this exclusion.
      - name: Unit & integration tests
        run: bun test --bail tests/unit $(ls tests/integration/*.test.ts | grep -vE 'hub-tui|viewport-ownership')

      # NO `playwright install` here: playwright provides no browser downloads
      # for this runner's platform (ubuntu 26.04). Chromium is pre-provisioned
      # on the runner host at ~/.cache/ms-playwright (with a version-dir
      # symlink when the repo's playwright rev lags the installed one).
      #
      # Scope notes:
      # - mobile / mobile-suggest projects need webkit (iPhone 14 device):
      #   not installable on this platform → not run in CI (backlog).
      # - "Ctrl+Tab / Ctrl+Shift+Tab cycles" tests are known-broken (merged
      #   while CI was down, fail headless) → excluded (backlog).
      - name: E2E tests (desktop + emulator, chromium)
        run: bunx playwright test tests/e2e --project=desktop --project=emulator --grep-invert "cycles to the (next|previous) tab"

      - name: Stop tmux server
        if: always()
        run: tmux -L "$TMUX_HUB_SOCKET" kill-server || true

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
